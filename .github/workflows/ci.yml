name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # workflow_dispatch e obrigatorio aqui, nao e conveniencia.
  # Este workflow corre em "push: main", e merges feitos pelo GITHUB_TOKEN
  # (como os do auto-merge.yml) NAO disparam outros workflows. Sem este
  # workflow_dispatch, o auto-merge nao teria como religar o CI depois do
  # squash — e a validacao do vault deixaria silenciosamente de correr em main.
  # Ver o step "Trigger downstream workflows" em .github/workflows/auto-merge.yml.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar vault
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # O repo tem ~500 MB de historico (planilhas versionadas); so
          # precisamos da arvore actual.
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip openpyxl

      - name: Validar integridade do vault
        run: python .github/scripts/validate_repo.py
