name: Push arquivo para o Google Drive

# Envia um ficheiro para uma pasta do Google Drive via rclone, num runner
# descartavel do GitHub Actions. Duas fontes possiveis para o ficheiro:
# um URL externo (download_url) ou um caminho dentro deste proprio
# repositorio (repo_path) - da exactamente um dos dois.
#
# Porque este caminho existe: a ferramenta MCP do Drive disponivel para o
# Claude exige colar o conteudo inteiro do ficheiro (em base64) dentro da
# propria chamada da ferramenta, o que e inviavel para ficheiros de poucos
# MB (um PDF de 5-10MB, ou o articles_final.xlsx de ~5,5MB, vira uma string
# de varios milhoes de caracteres). Um runner do GitHub Actions e um
# computador normal com disco e rede reais — obtem o ficheiro (por download
# ou por checkout do repo), envia com rclone (streaming real, sem limite de
# tamanho por chamada), e o runner e descartado no fim. Nada fica retido no
# repositorio git alem do que ja la estava.
#
# Pre-requisito: secret RCLONE_CONFIG no repositorio (Settings > Secrets and
# variables > Actions), com o conteudo do rclone.conf gerado por
# `rclone config` apos autorizar o rclone a aceder ao Google Drive (ver
# como_contornamos_o_akamai.md para o contexto de por que isto foi criado).

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: "URL externo de onde descarregar o ficheiro (ex.: link do mdpi-res.com). Alternativa ao repo_path - dar so um dos dois."
        required: false
        type: string
      repo_path:
        description: "Caminho de um ficheiro dentro deste repositorio (ex.: articles_final.xlsx). Alternativa ao download_url - dar so um dos dois."
        required: false
        type: string
      drive_folder_id:
        description: "ID da pasta do Google Drive de destino (o trecho depois de /folders/ no URL da pasta)"
        required: true
        type: string
      filename:
        description: "Nome com que o ficheiro deve ficar no Drive (ex.: 'AUTOR et al., ANO - sufixo-doi.pdf')"
        required: true
        type: string

jobs:
  push-to-drive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio (necessario so quando repo_path foi dado)
        if: inputs.repo_path != ''
        uses: actions/checkout@v4

      - name: Preparar ficheiro a partir do repositorio
        if: inputs.repo_path != ''
        run: |
          set -euo pipefail
          cp "${{ inputs.repo_path }}" "/tmp/upload_target"
          echo "Ficheiro copiado do repositorio:"
          file "/tmp/upload_target"
          ls -la "/tmp/upload_target"

      - name: Descarregar o ficheiro (necessario so quando download_url foi dado)
        if: inputs.download_url != ''
        run: |
          set -euo pipefail
          curl -sL "${{ inputs.download_url }}" -o "/tmp/upload_target" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            --max-time 120 --fail
          echo "Ficheiro descarregado:"
          file "/tmp/upload_target"
          ls -la "/tmp/upload_target"

      - name: Confirmar que ha um ficheiro para enviar
        run: |
          test -f "/tmp/upload_target" || \
            (echo "ERRO: nem repo_path nem download_url produziram um ficheiro - da exactamente um dos dois." && exit 1)

      - name: Instalar rclone
        run: |
          curl -s https://rclone.org/install.sh | sudo bash

      - name: Configurar rclone
        # O secret vai por env, nao por substituicao ${{ }} direta no script: o
        # token OAuth dentro do rclone.conf e JSON e contem aspas duplas, que
        # partem a string do printf se o GitHub Actions colar o valor
        # literalmente no comando antes de o bash correr.
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf

      - name: Enviar para o Google Drive
        run: |
          set -euo pipefail
          rclone copyto "/tmp/upload_target" \
            "drive:${{ inputs.filename }}" \
            --drive-root-folder-id "${{ inputs.drive_folder_id }}" \
            --progress

      - name: Confirmar upload
        run: |
          rclone lsl "drive:" --drive-root-folder-id "${{ inputs.drive_folder_id }}" | grep -F "${{ inputs.filename }}" || \
            (echo "AVISO: nao encontrei o ficheiro na listagem da pasta apos o upload" && exit 1)
