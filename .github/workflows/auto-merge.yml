name: Auto-merge

# Faz squash-merge automatico de PRs abertos assim que o CI passa.
# Usa apenas o GITHUB_TOKEN nativo — nao precisa de nenhum secret adicional.
#
# Porque "workflow_run" e nao "pull_request": o job precisa de permissao de
# escrita (contents: write) para mergear. Um workflow "pull_request" vindo de
# fork recebe token so-de-leitura, e correr codigo de PR com token de escrita
# seria inseguro. O gatilho workflow_run corre sempre a partir do codigo que
# esta em main, depois de o CI terminar, com o token de escrita — e o padrao
# recomendado pela GitHub para esta situacao.
on:
  workflow_run:
    # ATENCAO: estes sao os nomes ("name:") dos workflows de CI, nao os nomes
    # dos ficheiros. Se renomear o CI, actualizar aqui — caso contrario o
    # auto-merge deixa de disparar, sem erro nenhum.
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write        # criar o commit de merge em main
  pull-requests: write   # ler e mergear o PR
  actions: write         # NECESSARIO para createWorkflowDispatch no ultimo step.
                         # Sem isto a chamada de dispatch falha com HTTP 403.

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  auto-merge:
    # O nome deste job vira o nome do check run que este workflow cria sobre o
    # mesmo commit. Ele e filtrado explicitamente na verificacao de checks
    # abaixo (SELF_CHECK_NAME) — se mudar aqui, mudar la tambem.
    name: Auto-merge
    runs-on: ubuntu-latest
    # So avanca se o CI passou e se o run foi mesmo de um PR (ignora os runs
    # de "push: main" e de workflow_dispatch, que nao tem PR associado).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Resolver PR e validar pre-condicoes
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const headSha = context.payload.workflow_run.head_sha;

            // O array workflow_run.pull_requests vem vazio para PRs de fork,
            // por isso resolvemos o PR a partir do commit.
            const { data: prs } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: headSha,
              });

            const open = prs.filter((pr) => pr.state === 'open');
            if (open.length === 0) {
              core.info(`Nenhum PR aberto associado a ${headSha}. Nada a fazer.`);
              core.setOutput('proceed', 'false');
              return;
            }

            // Recarrega o PR: o objecto vindo do commit e um resumo e nao traz
            // campos como mergeable_state actualizados.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: open[0].number,
            });

            const skip = (reason) => {
              core.notice(`PR #${pr.number} nao sera mergeado: ${reason}`);
              core.setOutput('proceed', 'false');
            };

            if (pr.draft) return skip('esta em draft.');

            // O CI que acabou pode referir-se a um commit ja ultrapassado. Se
            // entretanto houve push novo, o merge tem de esperar pelo CI desse
            // commit, senao mergeavamos codigo que nunca foi validado.
            if (pr.head.sha !== headSha) {
              return skip(`head mudou (${headSha} -> ${pr.head.sha}); aguarda novo CI.`);
            }

            // Guarda de seguranca: este job corre com token de escrita. Aceitar
            // PRs de fork significaria deixar qualquer pessoa de fora mergear
            // para main sem revisao. Forks continuam a exigir merge manual.
            if (pr.head.repo.full_name !== pr.base.repo.full_name) {
              return skip('vem de um fork; merge automatico desactivado por seguranca.');
            }

            core.setOutput('proceed', 'true');
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', headSha);

      - name: Verificar que todos os checks passaram
        id: checks
        if: steps.resolve.outputs.proceed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // Este proprio workflow cria um check run sobre o mesmo commit.
            // Se o contassemos, estariamos a esperar por nos proprios e o job
            // nunca avancaria. Tem de bater certo com o "name:" do job.
            const SELF_CHECK_NAME = 'Auto-merge';
            const OK = new Set(['success', 'neutral', 'skipped']);
            const headSha = '${{ steps.resolve.outputs.head_sha }}';

            const checks = await github.paginate(
              github.rest.checks.listForRef,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
                per_page: 100,
              },
            );

            const relevant = checks.filter((c) => c.name !== SELF_CHECK_NAME);

            const pending = relevant.filter((c) => c.status !== 'completed');
            if (pending.length > 0) {
              core.notice(
                `Ainda a correr: ${pending.map((c) => c.name).join(', ')}. ` +
                'O merge sera tentado quando esses terminarem.',
              );
              core.setOutput('proceed', 'false');
              return;
            }

            const failed = relevant.filter((c) => !OK.has(c.conclusion));
            if (failed.length > 0) {
              core.notice(
                'Checks falhados: ' +
                failed.map((c) => `${c.name} (${c.conclusion})`).join(', '),
              );
              core.setOutput('proceed', 'false');
              return;
            }

            core.info(`${relevant.length} check(s) concluido(s) com sucesso.`);
            core.setOutput('proceed', 'true');

      - name: Squash-merge do PR
        id: merge
        if: steps.checks.outputs.proceed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number('${{ steps.resolve.outputs.pr_number }}');

            // mergeable e calculado de forma assincrona pela GitHub: na
            // primeira leitura vem quase sempre null. Fazemos polling curto.
            let pr;
            for (let attempt = 1; attempt <= 6; attempt++) {
              ({ data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              }));
              if (pr.mergeable !== null) break;
              core.info(`mergeable ainda indefinido (tentativa ${attempt}); a aguardar...`);
              await new Promise((r) => setTimeout(r, 5000));
            }

            if (pr.mergeable === false) {
              core.notice(
                `PR #${prNumber} tem conflitos (mergeable_state=${pr.mergeable_state}). ` +
                'Resolver manualmente.',
              );
              core.setOutput('merged', 'false');
              return;
            }

            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'squash',
              });
            } catch (error) {
              // 405 = bloqueado por branch protection / review em falta.
              // 409 = a head mudou entre a verificacao e o merge.
              if (error.status === 405 || error.status === 409) {
                core.notice(`Merge recusado pela GitHub (${error.status}): ${error.message}`);
                core.setOutput('merged', 'false');
                return;
              }
              throw error;
            }

            core.info(`PR #${prNumber} mergeado com squash.`);
            core.setOutput('merged', 'true');

      # ---------------------------------------------------------------------
      # NAO REMOVER ESTE STEP — nao e redundante.
      #
      # Pushes feitos com o GITHUB_TOKEN (incluindo o merge feito pelo step
      # acima) NAO disparam outros workflows. E uma proteccao anti-loop da
      # propria GitHub, documentada e sem forma de desligar:
      # https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow
      #
      # Consequencia pratica: qualquer workflow que escute "push: branches:
      # [main]" (CI em main, deploy, release, notificacoes) fica silenciosamente
      # parado depois de o auto-merge actuar — sem erro, sem aviso, apenas nao
      # corre. O sintoma tipico e "o deploy deixou de sair e ninguem sabe porque".
      #
      # workflow_dispatch e a excepcao documentada a essa regra: pode ser
      # invocado com o GITHUB_TOKEN. Por isso religamos aqui, a mao, cada
      # workflow que dependia do push para main.
      #
      # Se acrescentar um workflow novo que corra em "push: main":
      #   1. adicionar "workflow_dispatch:" ao bloco "on:" desse workflow;
      #   2. acrescentar o nome do ficheiro a lista DOWNSTREAM abaixo.
      # Sem os dois passos, o workflow novo nunca corre em merges automaticos.
      # ---------------------------------------------------------------------
      - name: Trigger downstream workflows
        if: steps.merge.outputs.merged == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // Workflows que correm em "push: main" e que o merge acima nao
            // disparou. Nomes de FICHEIRO (nao o "name:" interno).
            const DOWNSTREAM = [
              'ci.yml', // validacao do vault em main
            ];

            const ref = '${{ steps.resolve.outputs.base_ref }}' || 'main';

            for (const workflow_id of DOWNSTREAM) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id,
                  ref,
                });
                core.info(`Disparado ${workflow_id} em ${ref}.`);
              } catch (error) {
                // Nao falhar o job: o merge ja aconteceu e nao ha como o
                // desfazer. Um aviso visivel e melhor do que um job vermelho
                // sobre trabalho que ja esta feito.
                core.warning(
                  `Falha ao disparar ${workflow_id} em ${ref}: ` +
                  `${error.status ?? ''} ${error.message}. ` +
                  'Verificar se o workflow tem "workflow_dispatch:" no bloco "on:" ' +
                  'na branch por defeito, e se permissions inclui "actions: write".',
                );
              }
            }
